<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">List Note Card</title>
  <desc id="desc">A slightly tilted tear-edged paper note used as a container for a single flight-log entry in the list feed. Safe inner area is reserved for the content, callsign and timestamp.</desc>

  <defs>
    <style>
      @keyframes noteTilt {
        0%, 100% {
          transform: rotate(-1.5deg);
        }

        50% {
          transform: rotate(-1.2deg);
        }
      }

      .note-list {
        animation: noteTilt 9s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: 360px 200px;
      }
    </style>

    <clipPath id="note-list-clip">
      <path d="M40 30
               L86 24 L142 30 L208 22 L284 32 L360 24 L436 30 L512 22 L588 32 L660 26 L680 36
               L686 96 L680 168 L688 248 L680 322 L672 340
               L612 332 L536 342 L460 332 L384 342 L308 332 L232 340 L156 330 L80 340 L48 332
               L40 268 L48 192 L40 116 L44 60 Z"/>
    </clipPath>
  </defs>

  <g class="note-list" fill="none" stroke="#5f563f" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 30
             L86 24 L142 30 L208 22 L284 32 L360 24 L436 30 L512 22 L588 32 L660 26 L680 36
             L686 96 L680 168 L688 248 L680 322 L672 340
             L612 332 L536 342 L460 332 L384 342 L308 332 L232 340 L156 330 L80 340 L48 332
             L40 268 L48 192 L40 116 L44 60 Z"
          stroke-width="1.6" opacity=".78"/>

    <g stroke-width=".6" opacity=".28" stroke-dasharray="1 4">
      <path d="M60 96 H660"/>
    </g>

    <g stroke-width=".7" opacity=".18" stroke-dasharray="2 6">
      <path d="M60 110 H660"/>
      <path d="M60 124 H660"/>
    </g>

    <g stroke-width=".4" opacity=".14" stroke-dasharray="2 8">
      <path d="M70 300 H650"/>
    </g>

    <g opacity=".6">
      <path d="M44 60 L52 56 L46 52" stroke-width=".9"/>
      <path d="M680 36 L676 44 L684 46" stroke-width=".9"/>
    </g>

    <g stroke-width=".5" opacity=".22" fill="none">
      <path d="M86 24 q-2 4 0 8"/>
      <path d="M284 32 q-2 4 0 8"/>
      <path d="M436 30 q-2 4 0 8"/>
      <path d="M588 32 q-2 4 0 8"/>
      <path d="M156 330 q-2 4 0 8"/>
      <path d="M308 332 q-2 4 0 8"/>
      <path d="M460 332 q-2 4 0 8"/>
      <path d="M612 332 q-2 4 0 8"/>
    </g>
  </g>
</svg>
