<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">航行日志</title>
  <desc id="desc">A mobile-sized single-line Chinese title, narrower viewBox and slightly tighter letter spacing for small screens.</desc>

  <defs>
    <style>
      @keyframes logTitleDriftMobile {
        0%, 100% {
          opacity: .92;
          transform: translateY(0);
        }

        50% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      @keyframes logRuleFlowMobile {
        0%, 100% {
          opacity: .36;
          transform: scaleX(.92);
        }

        50% {
          opacity: .82;
          transform: scaleX(1);
        }
      }

      .han-m {
        font-family: 'Noto Serif SC', 'Songti SC', 'STSong', Georgia, serif;
        font-size: 132px;
        font-weight: 900;
        letter-spacing: 12px;
      }

      .lat-m {
        font-family: 'Didot', 'Bodoni 72', Georgia, 'Noto Serif', serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 5px;
      }

      .log-body-m {
        animation: logTitleDriftMobile 8s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .log-rules-m {
        animation: logRuleFlowMobile 6.4s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
    </style>
  </defs>

  <g class="log-body-m" fill="#5f563f">
    <text class="han-m" x="240" y="190" text-anchor="middle">航行日志</text>
  </g>

  <g fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <text class="han-m" x="240" y="190" text-anchor="middle" stroke-width="1.1">航行日志</text>
  </g>

  <g class="log-rules-m" fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 96 H396" stroke-width="2.2" opacity=".7"/>
    <path d="M118 110 H362" stroke-width="1" opacity=".4"/>
    <path d="M178 222 H302" stroke-width="1.1" opacity=".4"/>
  </g>

  <g fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
    <circle cx="74" cy="96" r="3" stroke-width="1.3"/>
    <circle cx="406" cy="96" r="3" stroke-width="1.3"/>
    <path d="M64 96 L54 96" stroke-width="1.1" opacity=".6"/>
    <path d="M416 96 L426 96" stroke-width="1.1" opacity=".6"/>
  </g>

  <g class="log-body-m" fill="#8c4f35" opacity=".72">
    <text class="lat-m" x="240" y="266" text-anchor="middle">FLIGHT&#160;·&#160;LOG</text>
  </g>
</svg>
