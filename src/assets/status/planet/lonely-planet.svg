<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Lonely Planet</title>
  <desc id="desc">A quiet single-color planet based on the frontend placeholder, with a soft surface highlight, inner contour, and tilted orbit.</desc>

  <defs>
    <style>
      @keyframes orbitFlow {
        0% {
          stroke-dashoffset: 0;
          opacity: .22;
          transform: rotate(-18deg);
        }

        50% {
          opacity: .36;
        }

        100% {
          stroke-dashoffset: -32;
          opacity: .22;
          transform: rotate(-16deg);
        }
      }

      @keyframes planetPulse {
        0%, 100% {
          opacity: .86;
          transform: scale(1);
        }

        50% {
          opacity: 1;
          transform: scale(1.018);
        }
      }

      @keyframes surfaceFlow {
        0%, 100% {
          transform: translateX(0);
        }

        50% {
          transform: translateX(-12px);
        }
      }

      .orbit-band {
        animation: orbitFlow 12s linear infinite;
        transform-box: fill-box;
        transform-origin: 380px 282px;
      }

      .planet-body {
        animation: planetPulse 9s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .surface-lines {
        animation: surfaceFlow 10s ease-in-out infinite;
      }
    </style>

    <clipPath id="planet-disc">
      <circle cx="380" cy="282" r="172"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round">
    <g class="orbit-band">
      <ellipse cx="380" cy="282" rx="274" ry="78" stroke-width="1.7" stroke-dasharray="8 8" opacity=".28"/>
      <ellipse cx="380" cy="282" rx="214" ry="54" stroke-width="1.1" opacity=".16"/>
    </g>

    <g class="planet-body">
    <circle cx="380" cy="282" r="172" stroke-width="3.8" opacity=".82"/>
    <circle cx="380" cy="282" r="126" stroke-width="1.5" opacity=".24"/>

    <g clip-path="url(#planet-disc)">
      <circle cx="326" cy="226" r="96" fill="#5f563f" stroke="none" opacity=".06"/>

      <g class="surface-lines">
      <path d="M174 255 C242 238 316 236 386 254 C459 273 531 274 594 253" stroke-width="1.5" opacity=".12"/>
      <path d="M178 291 C252 274 329 274 402 294 C471 313 536 312 598 291" stroke-width="1.5" opacity=".14"/>
      <path d="M190 329 C258 315 330 318 398 336 C462 353 526 352 588 330" stroke-width="1.3" opacity=".11"/>
      </g>

      <path d="M210 186 L594 104" stroke-width="2" opacity=".05"/>
      <path d="M184 236 L638 139" stroke-width="2" opacity=".05"/>
      <path d="M160 286 L662 179" stroke-width="2" opacity=".05"/>
      <path d="M140 336 L654 226" stroke-width="2" opacity=".05"/>
      <path d="M162 386 L620 288" stroke-width="2" opacity=".05"/>
    </g>

    <circle cx="236" cy="176" r="2.5" fill="#5f563f" stroke="none" opacity=".28"/>
    <circle cx="590" cy="204" r="2" fill="#5f563f" stroke="none" opacity=".2"/>
    <circle cx="610" cy="414" r="2.5" fill="#5f563f" stroke="none" opacity=".18"/>
    </g>
  </g>
</svg>
