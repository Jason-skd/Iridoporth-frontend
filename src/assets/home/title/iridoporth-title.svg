<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
  <title id="title">Iridoporth 舷窗</title>
  <desc id="desc">A restrained two-line Iridoporth title with compass-like arc cuts through the filled letterforms.</desc>

  <defs>
    <style>
      .latin {
        font-family: 'Didot', 'Bodoni 72', Georgia, 'Noto Serif', serif;
        font-size: 106px;
        font-weight: 900;
        letter-spacing: -1px;
      }

      .han {
        font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
        font-size: 146px;
        font-weight: 900;
        letter-spacing: 10px;
      }
    </style>

    <mask id="compass-cut-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="760" height="340">
      <rect width="760" height="340" fill="black"/>

      <g fill="white" stroke="white" stroke-linejoin="round">
        <text class="latin" x="380" y="124" text-anchor="middle" stroke-width="3">Iridoporth</text>
        <text class="han" x="380" y="294" text-anchor="middle" stroke-width="4">舷窗</text>
      </g>

      <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
        <path d="M503 56 A118 118 0 0 1 641 154" stroke-width="18"/>
        <path d="M528 68 A91 91 0 0 1 626 140" stroke-width="7" opacity=".9"/>
        <path d="M190 258 A118 118 0 0 0 310 312" stroke-width="15" opacity=".88"/>
      </g>
    </mask>
  </defs>

  <g mask="url(#compass-cut-mask)">
    <text class="latin" x="380" y="124" text-anchor="middle" fill="#5f563f">Iridoporth</text>
    <text class="han" x="380" y="294" text-anchor="middle" fill="#5f563f">舷窗</text>
  </g>

  <g fill="none" stroke="#5f563f" stroke-linejoin="round" opacity=".96">
    <text class="latin" x="380" y="124" text-anchor="middle" stroke-width="1.15">Iridoporth</text>
    <text class="han" x="380" y="294" text-anchor="middle" stroke-width="1.25">舷窗</text>
  </g>

  <g fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M503 56 A118 118 0 0 1 641 154" stroke-width="3.8" opacity=".86"/>
    <path d="M528 68 A91 91 0 0 1 626 140" stroke-width="1.7" opacity=".5"/>
    <path d="M190 258 A118 118 0 0 0 310 312" stroke-width="2.8" opacity=".62"/>
  </g>

  <g fill="none" stroke="#5f563f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 168 H556" stroke-width="5.8" opacity=".9"/>
    <path d="M238 182 H522" stroke-width="1.8" opacity=".5"/>
    <path d="M306 158 H454" stroke-width="1.35" opacity=".38"/>
  </g>
</svg>
