<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">Iridoporth aircraft window hero</title>
  <desc id="desc">A hand-journal style tray-table scene with a capsule-shaped aircraft window looking out over clouds, cabin light, and contrails.</desc>
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="4" seed="41" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.13" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply" />
    </filter>
    <filter id="roughInk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="17" />
      <feDisplacementMap in="SourceGraphic" scale="0.7" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#191816" flood-opacity=".22" />
    </filter>
    <linearGradient id="skyGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8d77f" />
      <stop offset="22%" stop-color="#f2efe5" />
      <stop offset="48%" stop-color="#b8d4d6" />
      <stop offset="76%" stop-color="#6fa8bd" />
      <stop offset="100%" stop-color="#1f5969" />
    </linearGradient>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".64" />
      <stop offset="38%" stop-color="#ffffff" stop-opacity=".1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="trayGrid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#191816" stroke-opacity=".045" />
    </pattern>
    <clipPath id="windowClip">
      <rect x="552" y="142" width="370" height="590" rx="185" />
    </clipPath>
    <clipPath id="noteClip">
      <rect x="142" y="646" width="384" height="246" rx="18" />
    </clipPath>
    <style>
      .ink { fill: #191816; }
      .paper { fill: #f3efe4; filter: url(#paperNoise); }
      .bluepaper { fill: #dbe5e3; filter: url(#paperNoise); }
      .sky { fill: #1f5969; }
      .glass { fill: #8fb7b2; }
      .red { fill: #c6543f; }
      .yellow { fill: #d8b24a; }
      .line { fill: none; stroke: #191816; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: url(#roughInk); }
      .line-soft { fill: none; stroke: #191816; stroke-opacity: .28; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .route { fill: none; stroke: #c6543f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 14; }
      .sky-line { fill: none; stroke: #1f5969; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 23px; fill: #191816; letter-spacing: .08em; }
      .micro { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; fill: #676259; letter-spacing: .06em; }
      .display { font-family: Avenir Next, Helvetica Neue, Arial, sans-serif; font-size: 76px; font-weight: 700; fill: #191816; }
      .display-small { font-family: Avenir Next, Helvetica Neue, Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #191816; }
    </style>
  </defs>

  <rect width="1400" height="1100" fill="#e3dccb" />
  <path d="M0 0h1400v1100H0z" fill="url(#trayGrid)" opacity=".9" />
  <path d="M0 850c166-64 310-86 452-65s238 69 411 56 291-76 537-31v290H0z" fill="#cfc5b2" opacity=".48" />

  <g transform="translate(88 76)" filter="url(#softShadow)">
    <rect x="0" y="0" width="1224" height="906" rx="32" class="paper" />
    <path d="M0 96h1224" class="line-soft" />
    <path d="M96 0v906" class="line-soft" />
    <path d="M1128 0v906" class="line-soft" />
    <text x="96" y="58" class="micro">IRIDOPORTH / HOME / TRAY TABLE PAGE</text>
    <text x="968" y="58" class="micro">SEAT-14A</text>
  </g>

  <g transform="translate(88 76)">
    <g clip-path="url(#windowClip)">
      <rect x="552" y="142" width="370" height="590" fill="url(#skyGlow)" />
      <path d="M552 518c52-34 103-44 154-29 61 18 103 48 166 12 26-15 42-18 50-10v241H552z" fill="#eef1e8" opacity=".9" />
      <path d="M552 582c78-40 144-42 198-7 64 41 112 15 172-16v173H552z" fill="#dbe5e3" opacity=".82" />
      <path d="M598 524c48-26 94-23 138 8M704 592c48-26 96-30 145-11" stroke="#ffffff" stroke-opacity=".72" stroke-width="10" fill="none" stroke-linecap="round" />
      <path d="M626 424c84 36 153 35 208-2" stroke="#f3efe4" stroke-opacity=".58" stroke-width="4" fill="none" stroke-linecap="round" />
      <path d="M604 346c55-22 110-19 165 8" stroke="#f3efe4" stroke-opacity=".34" stroke-width="9" fill="none" stroke-linecap="round" />
      <path d="M610 474c64-18 116-10 156 24 46 38 92 42 138 12" stroke="#f3efe4" stroke-opacity=".5" stroke-width="7" fill="none" stroke-linecap="round" />
      <path d="M634 536c56-20 108-18 158 8 42 22 82 25 120 8" stroke="#ffffff" stroke-opacity=".34" stroke-width="11" fill="none" stroke-linecap="round" />
      <path d="M628 264c100 34 178 28 236-18" stroke="#c6543f" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 18" opacity=".66" />
      <circle cx="657" cy="271" r="7" fill="#c6543f" />
      <circle cx="864" cy="246" r="7" fill="#d8b24a" />
      <rect x="570" y="164" width="270" height="530" fill="url(#windowGlass)" opacity=".62" transform="rotate(-13 705 429)" />
    </g>

    <rect x="514" y="104" width="446" height="666" rx="223" fill="none" stroke="#191816" stroke-width="34" />
    <rect x="536" y="126" width="402" height="622" rx="201" fill="none" stroke="#f3efe4" stroke-width="12" opacity=".92" />
    <rect x="552" y="142" width="370" height="590" rx="185" fill="none" stroke="#dbe5e3" stroke-width="8" opacity=".64" />
    <rect x="493" y="83" width="488" height="708" rx="244" fill="none" stroke="#1f5969" stroke-width="3" stroke-dasharray="3 18" opacity=".78" />
    <rect x="472" y="62" width="530" height="750" rx="265" fill="none" stroke="#c6543f" stroke-width="4" stroke-dasharray="1 25" opacity=".72" />

    <g>
      <circle cx="525" cy="278" r="11" class="yellow" />
      <circle cx="737" cy="93" r="11" class="red" />
      <circle cx="949" cy="278" r="11" class="glass" />
      <circle cx="949" cy="596" r="11" class="yellow" />
      <circle cx="737" cy="781" r="11" class="red" />
      <circle cx="525" cy="596" r="11" class="glass" />
    </g>

    <g transform="translate(142 154) rotate(-5)">
      <rect x="0" y="0" width="310" height="128" rx="14" class="bluepaper" />
      <path d="M28 40h184M28 72h246M28 104h146" class="line-soft" />
      <text x="26" y="32" class="micro">raspi signal</text>
      <rect x="220" y="20" width="54" height="38" rx="19" fill="#1f5969" />
      <path d="M238 39h18M247 30v18" stroke="#f3efe4" stroke-width="3" stroke-linecap="round" />
    </g>

    <g transform="translate(928 146) rotate(4)">
      <rect x="0" y="0" width="194" height="156" rx="12" fill="#191816" />
      <path d="M26 44h110M26 75h142M26 106h94" stroke="#f3efe4" stroke-opacity=".28" stroke-width="8" stroke-linecap="round" />
      <rect x="25" y="120" width="68" height="20" rx="10" fill="#c6543f" />
      <text x="28" y="26" class="micro" fill="#f3efe4">status</text>
    </g>

    <g clip-path="url(#noteClip)">
      <rect x="142" y="646" width="384" height="246" rx="18" class="paper" />
      <path d="M142 705h384M142 764h384M142 823h384" stroke="#1f5969" stroke-opacity=".12" stroke-width="2" />
      <path d="M178 724c80-28 144 26 217-3s84-22 111-1" class="sky-line" opacity=".62" />
      <path d="M178 794h260M178 835h198" class="line-soft" />
      <rect x="376" y="674" width="92" height="42" rx="4" fill="none" stroke="#c6543f" stroke-width="3" stroke-dasharray="5 6" />
      <text x="390" y="702" class="micro" fill="#c6543f">LOG</text>
    </g>

    <g transform="translate(864 706) rotate(-7)">
      <rect x="0" y="0" width="244" height="92" rx="46" fill="#191816" />
      <rect x="24" y="19" width="44" height="54" rx="22" fill="#8fb7b2" />
      <path d="M98 34h92M98 58h66" stroke="#f3efe4" stroke-width="8" stroke-opacity=".3" stroke-linecap="round" />
      <text x="98" y="76" class="micro" fill="#f3efe4">open log</text>
    </g>

    <path d="M232 346c70 44 145 58 224 42 78-16 129-55 180-85" class="route" />
    <path d="M960 640c-54 38-121 55-200 51-74-4-132-28-174-72" class="route" />

    <g transform="translate(164 448)">
      <text x="0" y="0" class="display">Iridoporth</text>
      <text x="4" y="48" class="label">aircraft window / cabin notebook / live signal</text>
      <path d="M6 76c58-18 105 15 164-5s86-19 126-2" class="sky-line" opacity=".65" />
    </g>

    <g transform="translate(976 510)">
      <text x="0" y="0" class="display-small">small</text>
      <text x="0" y="44" class="display-small">window</text>
      <text x="2" y="82" class="micro">high weather</text>
    </g>
  </g>
</svg>
