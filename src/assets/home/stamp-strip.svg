<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-labelledby="title desc">
  <title id="title">Iridoporth aircraft stamp strip</title>
  <desc id="desc">Reusable aircraft-window stamps, badges, and small hand-journal motifs for Iridoporth.</desc>
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31" />
      <feDisplacementMap in="SourceGraphic" scale="0.7" />
    </filter>
    <style>
      .paper { fill: #f3efe4; }
      .sky { fill: #1f5969; }
      .glass { fill: #8fb7b2; }
      .red { fill: #c6543f; }
      .yellow { fill: #d8b24a; }
      .redline { fill: none; stroke: #c6543f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough); }
      .seal { fill: none; stroke: #c6543f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 7; filter: url(#rough); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 17px; fill: #191816; letter-spacing: .08em; }
      .mono-red { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 16px; fill: #c6543f; letter-spacing: .1em; }
    </style>
  </defs>

  <rect width="1100" height="240" fill="none" />

  <g transform="translate(30 34)">
    <rect x="0" y="0" width="176" height="116" rx="10" class="seal" />
    <text x="31" y="44" class="mono-red">HOME</text>
    <text x="31" y="76" class="mono-red">SEAT-14A</text>
    <path d="M31 91h108" class="redline" opacity=".55" />
  </g>

  <g transform="translate(244 16)">
    <rect x="24" y="0" width="116" height="172" rx="58" fill="#f3efe4" stroke="#191816" stroke-width="5" />
    <rect x="46" y="22" width="72" height="128" rx="36" fill="#1f5969" />
    <path d="M58 93c18-12 37-13 58-2" stroke="#f3efe4" stroke-width="7" stroke-linecap="round" opacity=".78" />
    <path d="M58 118c20-13 42-14 66-2" stroke="#f3efe4" stroke-width="7" stroke-linecap="round" opacity=".78" />
    <rect x="8" y="-12" width="148" height="196" rx="74" fill="none" stroke="#c6543f" stroke-width="2.5" stroke-dasharray="2 12" />
  </g>

  <g transform="translate(444 50)">
    <rect x="0" y="0" width="210" height="74" rx="37" fill="#191816" />
    <rect x="26" y="16" width="30" height="42" rx="15" class="glass" />
    <path d="M91 28h84M91 48h54" stroke="#f3efe4" stroke-width="7" stroke-opacity=".34" stroke-linecap="round" />
    <text x="84" y="92" class="mono">raspi</text>
  </g>

  <g transform="translate(690 44)">
    <path d="M0 92c42-53 85-65 130-37 46 29 82 20 108-27 33-60 78-26 110 10" fill="none" stroke="#1f5969" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 15" />
    <circle cx="0" cy="92" r="8" class="red" />
    <circle cx="130" cy="55" r="8" class="yellow" />
    <circle cx="238" cy="28" r="8" class="glass" />
    <circle cx="348" cy="38" r="8" class="red" />
    <text x="102" y="134" class="mono">flight path</text>
  </g>

  <g transform="translate(54 174)">
    <path d="M0 0h984" stroke="#191816" stroke-opacity=".14" stroke-width="2" />
    <text x="0" y="34" class="mono">IRIDOPORTH / STAMPS / TRAY TABLE TEXTURE / AIRCRAFT WINDOW MARKS</text>
  </g>
</svg>
