<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Iridoporth aircraft journal fragments</title>
  <desc id="desc">Hand-journal fragments previewing onboard raspi status and private notes.</desc>
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.84" numOctaves="4" seed="61" result="noise" />
      <feColorMatrix in="noise" type="saturate" values="0" result="mono" />
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.14" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#191816" flood-opacity=".16" />
    </filter>
    <pattern id="ruled" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 43H44" stroke="#1f5969" stroke-opacity=".13" />
    </pattern>
    <style>
      .paper { fill: #f3efe4; filter: url(#paperNoise); }
      .bluepaper { fill: #dbe5e3; filter: url(#paperNoise); }
      .sky { fill: #1f5969; }
      .glass { fill: #8fb7b2; }
      .red { fill: #c6543f; }
      .yellow { fill: #d8b24a; }
      .softline { fill: none; stroke: #191816; stroke-opacity: .24; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .seal { fill: none; stroke: #c6543f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 7; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 18px; fill: #191816; letter-spacing: .06em; }
      .small { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; fill: #68645b; letter-spacing: .06em; }
      .display { font-family: Avenir Next, Helvetica Neue, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #191816; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="none" />

  <g filter="url(#shadow)">
    <g transform="translate(92 72) rotate(-4)">
      <rect width="436" height="294" rx="20" class="paper" />
      <rect width="436" height="294" rx="20" fill="url(#ruled)" opacity=".76" />
      <text x="32" y="52" class="mono">RASPI STATUS</text>
      <text x="32" y="102" class="display">onboard pulse</text>
      <path d="M34 137h268M34 181h340M34 225h234" class="softline" />
      <g transform="translate(334 50)">
        <rect x="0" y="0" width="82" height="116" rx="41" fill="#191816" />
        <rect x="20" y="18" width="42" height="78" rx="21" fill="#8fb7b2" />
        <path d="M29 60h24M41 42v36" stroke="#f3efe4" stroke-width="3" stroke-linecap="round" />
      </g>
      <rect x="292" y="204" width="96" height="44" rx="22" fill="#1f5969" />
      <text x="313" y="232" class="small" fill="#f3efe4">LIVE</text>
    </g>

    <g transform="translate(590 116) rotate(5)">
      <rect width="434" height="260" rx="18" class="bluepaper" />
      <text x="34" y="50" class="mono">FLIGHT-LOG</text>
      <path d="M34 92c68-24 118 23 183-1 69-25 112-28 164-4" fill="none" stroke="#1f5969" stroke-width="4" stroke-linecap="round" />
      <path d="M34 132h328M34 172h278M34 212h224" class="softline" />
      <rect x="298" y="32" width="92" height="46" rx="4" class="seal" />
      <text x="315" y="61" class="small" fill="#c6543f">NOTE</text>
      <circle cx="68" cy="92" r="8" class="red" />
      <circle cx="214" cy="91" r="8" class="yellow" />
      <circle cx="381" cy="87" r="8" class="glass" />
    </g>

    <g transform="translate(206 434) rotate(3)">
      <rect width="304" height="182" rx="16" fill="#191816" />
      <text x="28" y="48" class="small" fill="#f3efe4">WINDOW INDEX</text>
      <rect x="46" y="68" width="76" height="94" rx="38" fill="#f3efe4" />
      <rect x="62" y="84" width="44" height="62" rx="22" fill="#1f5969" />
      <path d="M138 82h118M138 112h86M138 140h126" stroke="#f3efe4" stroke-width="7" stroke-opacity=".28" stroke-linecap="round" />
      <path d="M72 116h24M84 98v36" stroke="#f3efe4" stroke-opacity=".7" stroke-width="2" />
    </g>

    <g transform="translate(544 466) rotate(-5)">
      <rect width="250" height="156" rx="15" class="paper" />
      <text x="28" y="44" class="small">ANON</text>
      <text x="28" y="94" class="display">...</text>
      <path d="M142 82c24-20 50-20 78 0" fill="none" stroke="#c6543f" stroke-width="4" stroke-linecap="round" />
      <path d="M28 126h170" class="softline" />
    </g>

    <g transform="translate(810 424) rotate(7)">
      <rect width="244" height="178" rx="18" fill="#d8b24a" />
      <rect x="40" y="28" width="72" height="100" rx="36" fill="#f3efe4" stroke="#191816" stroke-width="6" />
      <rect x="55" y="43" width="42" height="70" rx="21" fill="#1f5969" />
      <path d="M140 58h58M140 88h42M140 118h68" stroke="#191816" stroke-width="5" stroke-opacity=".42" stroke-linecap="round" />
      <text x="40" y="154" class="small">OPEN</text>
    </g>
  </g>

  <path d="M128 684c126-70 224-72 294-6 84 78 181 56 290-20 116-80 219-85 308-16" fill="none" stroke="#c6543f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 17" opacity=".82" />
  <circle cx="128" cy="684" r="8" class="red" />
  <circle cx="422" cy="678" r="8" class="yellow" />
  <circle cx="712" cy="658" r="8" class="glass" />
  <circle cx="1020" cy="642" r="8" class="red" />
</svg>
